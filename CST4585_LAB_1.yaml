lab:
  description: Enterprise VLAN, Trunking, STP, DHCP, and Port Security
  notes: "CST4585 – LAB 1\nEnterprise VLAN, Trunking, STP, DHCP, and Port Security\n\
    Lab Type\nHands-on, instructor-guided training lab\nEstimated Time\n60-90 minutes\n\
    Lab Environment\n•\tCisco Modeling Labs (CML) or equivalent virtual lab platform\n\
    •\tThree IOS XE Layer 2 switches\n•\tDesktop end hosts\n\n1. Lab Overview\nIn\
    \ this lab, students will analyse and validate an enterprise-style switched network\
    \ supporting segmented VLANs, redundant Layer 2 paths, Spanning Tree Protocol\
    \ (Rapid-PVST), DHCP services, and port security.\n\nThe topology represents a\
    \ small campus access/distribution design with:\n•\tOne access switch (A1)\n•\t\
    Two distribution switches (D1 and D2)\n•\tSeparate Staff and Student VLANs\n•\t\
    Redundant trunk links for resiliency\nRather than building from scratch, this\
    \ lab emphasises verification, troubleshooting, and operational understanding,\
    \ which aligns with real-world professional responsibilities.\n\n2. Learning Objectives\n\
    By the end of this lab, participants will be able to:\n•\tInterpret an existing\
    \ enterprise switch configuration\n•\tVerify VLAN segmentation and trunking behaviour\n\
    •\tAnalyse Rapid-PVST root bridge placement\n•\tValidate DHCP scope operation\
    \ per VLAN\n•\tAssess Layer 2 security mechanisms (Port Security, BPDU Guard)\n\
    •\tTroubleshoot common VLAN and STP issues\n\n3. Network Topology Summary\nDevices\n\
    Device\tRole\nA1\tAccess switch\nD1\tDistribution switch (Primary STP root)\n\
    D2\tDistribution switch (Secondary STP root)\nPC1\tStaff endpoint (VLAN 10)\n\
    PC2\tStudent endpoint (VLAN 20)\nVLANs\nVLAN\tName\tSubnet\tGateway\n10\tSTAFF\t\
    10.0.0.0/27\t10.0.0.30\n20\tSTUDENT\t10.0.0.32/27\t10.0.0.61\n\n4. Pre-Lab Review\
    \ (Lecture or Self-Study)\nParticipants should be comfortable with:\n•\tVLAN tagging\
    \ (802.1Q)\n•\tTrunk vs access ports\n•\tSpanning Tree root election\n•\tDHCP\
    \ relay vs local DHCP pools\n•\tPort security modes and violations\n\n5. Task\
    \ 1 – VLAN and Port Assignment Verification\nObjective\nConfirm that end devices\
    \ are correctly placed into their assigned VLANs.\nSteps (on A1)\n1.\tDisplay\
    \ VLAN membership: show vlan brief\n2.\tVerify:\no\tEthernet0/2 → VLAN 10 (Staff)\n\
    o\tEthernet0/3 → VLAN 20 (Student)\n3.\tConfirm PortFast and BPDU Guard:\no\t\
    show spanning-tree interface ethernet0/2 detail\no\tshow spanning-tree interface\
    \ ethernet0/3 detail\n\nExpected Outcome\n•\tPorts are in the correct VLAN\n•\t\
    PortFast enabled\n•\tBPDU Guard active\n\n6. Task 2 – Trunk Configuration Validation\n\
    Objective\nEnsure inter-switch links are correctly trunking VLAN traffic.\nSteps\n\
    On A1, D1, and D2:\nshow interfaces trunk\nVerify:\n•\tDot1Q encapsulation\n•\t\
    VLANs 10 and 20 are allowed\n•\tTrunks are forwarding (not blocking)\nDiscussion\
    \ Point\nWhy are trunk ports not configured with PortFast or BPDU Guard?\n\n7.\
    \ Task 3 – Spanning Tree Analysis\nObjective\nValidate STP root bridge placement\
    \ and redundancy design.\nSteps\nOn all switches:\nshow spanning-tree vlan 10\n\
    show spanning-tree vlan 20\nExpected Results\n•\tD1 is root for VLANs 1 and 10\n\
    •\tD1 is secondary root (lower priority for VLAN 20)\n•\tD2 is root for VLAN 20\n\
    •\tD2 is secondary root (lower priority for VLANs 1 and 10)\n•\tOne redundant\
    \ link is in blocking state per VLAN\nProfessional Insight\nExplain why different\
    \ VLANs may use different root bridges in larger environments.\n\n8. Task 4 –\
    \ DHCP Operation Verification\nObjective\nEnsure DHCP is providing correct addressing\
    \ per VLAN.\nSteps (on D1)\nshow ip dhcp pool\nshow ip dhcp binding\nOn PCs\n\
    •\tRenew DHCP lease\n•\tVerify assigned IP, gateway, and subnet\nExpected Outcome\n\
    Host\tVLAN\tIP Range\nPC1\t10\t10.0.0.1 – 10.0.0.24\nPC2\t20\t10.0.0.33 – 10.0.0.56\n\
    \n9. Task 5 – Port Security Validation\nObjective\nConfirm MAC address enforcement\
    \ on access ports.\nSteps (on A1)\nshow port-security interface ethernet0/2\n\
    show port-security interface ethernet0/3\nVerify:\n•\tSticky MAC addresses learned\n\
    •\tViolation mode = shutdown (default)\n•\tNo violations present\n\nScenario Exercise\n\
    Instructor simulates:\n•\tMAC address change\n•\tObserve port shutdown behaviour\n\
    •\tRecovery using:\nshutdown\nno shutdown\n\n10. Task 6 – End-to-End Connectivity\
    \ Testing\nObjective\nConfirm correct Layer 2 and Layer 3 behaviour.\nTests\n\
    •\tPC1 → Default Gateway\n•\tPC2 → Default Gateway\n•\tPC1 → PC2 (should fail\
    \ without routing)\n•\tVerify switch management VLAN reachability\n\n11. Post-Lab\
    \ Reflection\nStudents should be able to answer:\n•\tWhy Rapid-PVST is preferred\
    \ in access networks\n•\tHow STP and trunking interact\n•\tSecurity risks of improper\
    \ access port configuration\n•\tOperational benefits of centralised DHCP\n\n12.\
    \ Troubleshooting Challenge (to come!)\nInstructor introduces faults -\nStudents\
    \ must:\n1.\tIdentify the issue\n2.\tExplain the root cause\n3.\tApply a fix\n\
    4.\tVerify resolution"
  title: CST4585 LAB-1-Troubleshooting
  version: 0.3.0
