    text_bold: true
    text_content: "Lab Overview\nIn this lab, you will analyse and validate an enterprise-style\
      \ switched network supporting segmented\nVLANs, redundant Layer 2 paths, Spanning\
      \ Tree Protocol (Rapid-PVST), DHCP services, and port security.\n\nThe topology\
      \ represents a small campus access/distribution design with:\n•\tOne access\
      \ switch (A1)\n•\tTwo distribution switches (D1 and D2)\n•\tSeparate Staff and\
      \ Student VLANs\n•\tRedundant trunk links for resiliency\n\nRather than building\
      \ from scratch, this lab emphasizes verification, troubleshooting,\nand operational\
      \ understanding, which aligns with real-world professional responsibilities.\n\
      \nClick on the 'GUIDE' tab for instructions."
    text_font: monospace
    text_italic: false
    text_size: 9
